  - name: "Glassnode Insights"
    type: "rss"
    url: "https://insights.glassnode.com/rss/"

  # === MCP 서버 소스 (한국 금융 데이터) ===
  # API 키 불필요 - 무료 서버
  - name: "한국 주식테마 MCP"
    type: "mcp"
    url: "https://stockmatrix.co.kr"
    config:
      transport: stdio
      command: npx
      args: ["-y", "stockmatrix-mcp"]
      tool: get_market_summary
      arguments: {}
      transform:
        title_field: name
        link_field: detailUrl
        summary_fields: ["score", "stage", "change7d", "topStocks"]
        published_field: generatedAt

  - name: "DART 공시 MCP"
    type: "mcp"
    url: "https://github.com/jjlabsio/korea-stock-mcp"
    config:
      transport: stdio
      command: uvx
      args: ["--from", "git+https://github.com/jjlabsio/korea-stock-mcp", "korea-stock-mcp"]
      env:
        DART_API_KEY: "${DART_API_KEY}"
      tool: get_disclosures
      arguments:
        corp_code: ""
        bgn_de: "20260301"
        end_de: "20260401"
      transform:
        title_field: report_nm
        link_field: report_url
        summary_fields: ["corp_name", "rcept_dt", "flr_nm"]
        published_field: rcept_dt

  # NOTE: pykrx-mcp는 Python 3.13 비호환 - FinanceDataReader로 대체
  # - name: "KRX 주가 MCP"
  #   type: "mcp"
  #   ...

  # === FinanceData 소스 (Python 라이브러리) ===
  # pip install 'radar-core[financedata]' 필요
  - name: "KOSPI 종목 리스트"
    type: "financedata"
    config:
      library: fdr
      method: StockListing
      arguments:
        market: KOSPI
        limit: 30
      transform:
        title_field: Name
        link_field: Code
        summary_fields: ["Market", "Close", "Marcap"]

  - name: "KOSDAQ 종목 리스트"
    type: "financedata"
    config:
      library: fdr
      method: StockListing
      arguments:
        market: KOSDAQ
        limit: 30
      transform:
        title_field: Name
        link_field: Code
        summary_fields: ["Market", "Close", "Volume"]

  - name: "DART 공시 (FinanceData)"
    type: "financedata"
    config:
      library: dart
      method: list
      env:
        DART_API_KEY: "${DART_API_KEY}"
      arguments:
        start: last_week
        end: today
        limit: 50
      transform:
        title_field: report_nm
        summary_fields: ["corp_name", "rcept_dt"]

