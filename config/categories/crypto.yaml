category_name: crypto
display_name: 암호화폐 레이더
data_quality:
  priority: P2
  primary_motion: intelligence
  weakest_dimension: verification
  quality_outputs:
    freshness_report: reports/crypto_quality.json
    dated_freshness_report_pattern: reports/crypto_YYYYMMDD_quality.json
    tracked_event_models:
    - exchange_listing_notice
    - regulatory_action
    - onchain_metric
    - liquidity_snapshot
  event_models:
    exchange_listing_notice:
      date_fields:
      - notice_date
      - listing_date
      - collected_at
      required_fields:
      - exchange
      - asset_symbol
      - project_id
      - source_url
    regulatory_action:
      date_fields:
      - action_date
      - published_date
      - collected_at
      required_fields:
      - regulator
      - jurisdiction
      - project_id
      - source_url
    onchain_metric:
      date_fields:
      - metric_time
      - collected_at
      required_fields:
      - chain
      - metric_name
      - metric_value
    liquidity_snapshot:
      date_fields:
      - observed_at
      - collected_at
      required_fields:
      - exchange
      - asset_pair
      - liquidity_metric
  canonical_keys:
    project:
    - chain
    - project_slug
    - contract_address
    asset_pair:
    - exchange
    - base_asset
    - quote_asset
  freshness_sla:
    exchange_listing_notice_hours: 24
    regulatory_action_days: 3
    onchain_metric_hours: 12
    liquidity_snapshot_hours: 12
  quality_gates:
  - 뉴스/소셜 심리와 거래소 공식 공지를 분리한다
  - ticker collision을 chain/project canonical key로 정리한다
  - 가격 시각, 거래소, 통화 기준을 명시한다
  - 온체인 지표는 source와 기준 시각을 함께 기록한다
source_backlog:
  operational_candidates:
  - id: upbit_notice_feed
    name: Upbit listing and delisting notices
    signal_type: exchange_listing_notice
    activation_gate: parser stability, market code mapping, and notice/listing date
      separation
  - id: binance_announcement_feed
    name: Binance listing and delisting announcements
    signal_type: exchange_listing_notice
    activation_gate: ToS review, asset pair mapping, and duplicate announcement handling
  - id: sec_cftc_regulatory_actions
    name: SEC/CFTC crypto regulatory actions
    signal_type: regulatory_action
    activation_gate: regulator taxonomy, case id mapping, and jurisdiction tagging
  - id: defillama_onchain_metrics
    name: DeFiLlama and on-chain metrics
    signal_type: onchain_metric
    activation_gate: metric definitions, chain/project mapping, and timestamp normalization
