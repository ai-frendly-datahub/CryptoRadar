    - git+https://github.com/jjlabsio/korea-stock-mcp
    - korea-stock-mcp
    env:
      DART_API_KEY: ${DART_API_KEY}
    tool: get_disclosures
    arguments:
      corp_code: ''
      bgn_de: '20260301'
      end_de: '20260401'
    transform:
